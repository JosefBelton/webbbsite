<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>graphic injector</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px; 
      max-width: 800px;
      margin: 0 auto;
    }
    .gallery-image {
      width: 100%;       
      height: auto;      
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  
  <div class="gallery-container" id="gallery"></div>

  <script>
  
    const folderPath = "assets/"; 
    const imageFiles = [
      "frog.webp",
      "inanga.webp",
      "mushyMarket.webp",
      "tree.webp",
      "tuna.webp",
    ];

    const gallery = document.getElementById("gallery");
    const randomIndex = Math.floor(Math.random() * imageFiles.length);
    const randFile = imageFiles[randomIndex];

      const img = document.createElement("img"); //this changes to random
      img.src = folderPath + randFile;
      img.alt = randFile;
      img.className = "gallery-image";
      gallery.appendChild(img);
    
  </script>

</body>
</html>
