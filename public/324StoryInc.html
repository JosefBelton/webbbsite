<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nzpq23kaemiemi</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    .gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px; 
      max-width: 800px;
      margin: 0 auto;
    }
    .gallery-image {
      width: 100%;       
      height: auto;      
      max-width: 1000px; 
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="gallery-container" id="gallery"></div>

  <script>

    const folderPath = "324StoryInc/"; 
    const imageFiles = [
      "1.png",
      "2.png",
      "3.png",
      "4.png",
      "5.png",
      "6.png",
      "7.png",
      "8.png",
      "9.png",
      "10.png",
    ];

    const gallery = document.getElementById("gallery");

    imageFiles.forEach(fileName => {
      const img = document.createElement("img");
      img.src = folderPath + fileName;
      img.alt = fileName;
      img.className = "gallery-image";
      gallery.appendChild(img);
    });
  </script>

</body>
</html>
